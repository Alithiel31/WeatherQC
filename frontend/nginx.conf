# ⚠️ Piège nginx à connaître avant d'éditer ce fichier
#
# `add_header` ne fusionne pas : dès qu'un bloc enfant en déclare un seul, il
# **perd tous** ceux hérités du parent. Les en-têtes de sécurité ci-dessous sont
# donc posés une fois au niveau `server`, et aucun bloc `location` ne doit
# utiliser `add_header` sans les répéter intégralement.
#
# C'est pour cette raison que la mise en cache s'appuie sur `expires`, qui pose
# `Expires` et `Cache-Control` par son propre mécanisme, sans casser l'héritage.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La version de nginx n'apprend rien d'utile à personne.
    server_tokens off;

    # ── Durcissement ──────────────────────────────────────────────────────
    # `helmet` ne couvre que les réponses JSON de /api/, où une CSP est
    # décorative. Le document qui exécute réellement le JavaScript est servi
    # ici, et il ne portait aucun en-tête.
    #
    # `style-src` autorise l'inline : Leaflet positionne ses tuiles via
    # `element.style.transform`, et les barres min–max de la semaine portent un
    # style calculé. Une CSP stricte les casserait toutes les deux en silence.
    # `img-src data:` couvre les sprites Leaflet, embarqués dans le CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://tilecache.rainviewer.com https://tile.openweathermap.org; connect-src 'self' https://*.basemaps.cartocdn.com https://tilecache.rainviewer.com https://tile.openweathermap.org; manifest-src 'self'; worker-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Le tunnel Cloudflare termine le TLS : l'application n'est jamais servie en
    # clair sur son domaine public.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Compression ───────────────────────────────────────────────────────
    # Le bundle et le CSS pèsent ~230 ko à eux deux, servis depuis un Raspberry
    # Pi derrière un lien résidentiel.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Fichiers particuliers ─────────────────────────────────────────────
    # Pas d'`add_header Content-Type` ici : `mime.types` assigne déjà
    # `application/json` et `text/html`, et le doublon qui en résultait est
    # exactement ce qui fait échouer la vérification Digital Asset Links
    # d'Android sur assetlinks.json. Les retirer préserve en prime l'héritage
    # des en-têtes de sécurité.
    location = /.well-known/assetlinks.json {
        try_files $uri =404;
    }

    location = /privacy-policy.html {
        try_files $uri =404;
    }

    # ── Politique de cache ────────────────────────────────────────────────
    # Les noms d'assets portent un hachage de contenu : ils ne changent jamais
    # sous une même URL.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # La coquille et le service worker, eux, doivent pouvoir changer : sans
    # cela un déploiement resterait invisible jusqu'à expiration du cache.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3005/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sans cet en-tête, le backend ne voit que l'IP de ce conteneur et sa
        # limitation de débit s'applique à tous les clients d'un seul bloc.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
