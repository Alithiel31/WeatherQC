name: Deploy TWA to Play Store

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build TWA Android App']
    types: [completed]
    branches: [main]

# `actions: read` est nécessaire pour lister/télécharger l'artefact du workflow de build.
permissions:
  contents: read
  actions: read

# Une seule publication Play Store à la fois.
concurrency:
  group: twa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Un déclenchement manuel n'est autorisé que depuis main : on ne publie jamais
    # un artefact construit sur une branche de travail.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Download AAB artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: build-twa.yml
          name: qcweather-release
          # Sans ce filtre, l'action récupère le dernier artefact toutes branches confondues.
          branch: main
          if_no_artifact_found: fail

      - name: Publish to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.alithiel31.qcweather
          releaseFiles: app-release-bundle.aab
          track: internal
