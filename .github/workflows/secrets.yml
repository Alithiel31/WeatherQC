name: Fuites de secrets

# Le dépôt manipule un keystore de signature Android encodé en base64 et le JSON
# d'un compte de service Play Store. Un secret commité par accident est le mode
# de défaillance le plus coûteux du projet — la rotation d'une clé de signature
# Play n'est pas anodine — et c'était le seul que rien ne surveillait.
on:
  push:
    branches: [main]
  pull_request:
  # Les règles de détection s'enrichissent avec les versions de gitleaks : un
  # motif inconnu aujourd'hui peut être reconnu plus tard.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: gitleaks — historique complet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `fetch-depth: 0` est le point central de ce workflow. Un secret retiré
      # par un commit suivant reste extractible de l'historique, et c'est
      # exactement le cas qu'on cherche : scanner l'arbre de travail ne
      # trouverait rien.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Binaire officiel plutôt que l'action `gitleaks/gitleaks-action` : celle-ci
      # exige une clé de licence hors dépôts publics, et l'archive se vérifie par
      # empreinte — garantie plus forte que l'épinglage par SHA appliqué aux
      # autres actions tierces du dépôt.
      #
      # Version et empreinte se relèvent à la main, Dependabot ne lisant pas les
      # étapes `run` :
      #   gh release view --repo gitleaks/gitleaks --json tagName,assets
      - name: Installer gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # `--redact` : sans lui, un secret détecté serait recopié en clair dans les
      # logs Actions — publics sur un dépôt public. La détection deviendrait
      # elle-même la fuite.
      - name: Scanner l'historique
        run: gitleaks git --redact --verbose --exit-code 1 .
