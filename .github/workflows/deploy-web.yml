name: Deploy Web to Raspberry Pi

# Contrairement à `build-twa.yml` (runner GitHub, secrets éphémères), ce
# workflow tourne sur le Pi lui-même : c'est le runner self-hosted qui va
# chercher le job en se connectant vers GitHub — aucun port entrant à ouvrir
# sur le Pi, aucune clé SSH à stocker en secret.
#
# Le déploiement ne part qu'une fois la CI terminée et verte sur `main` : même
# patron que `deploy-twa.yml`, qui s'enchaîne sur `build-twa.yml`. Déclenché sur
# `push`, il courait en parallèle de la CI et partait même quand elle échouait.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Une seule mise à jour à la fois : deux déploiements simultanés se
# disputeraient les mêmes conteneurs sur le même hôte.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Pi — build & redémarrage
    # Label dédié plutôt que `self-hosted` seul : si un autre runner
    # self-hosted rejoignait un jour ce dépôt, il ne faut pas qu'il hérite par
    # erreur d'un job qui déchiffre ou touche à la prod du Pi.
    runs-on: [self-hosted, raspberry-pi]
    timeout-minutes: 20
    # Jamais de déploiement si la CI a échoué ; un lancement manuel reste
    # possible, mais seulement depuis `main`. `event == 'push'` écarte une CI de
    # pull request dont la branche source s'appellerait aussi `main` (fork) : le
    # filtre `branches` du déclencheur porte sur le nom de la branche, pas sur
    # le dépôt d'origine.
    if: >-
      ${{ (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

    steps:
      # `clean: false` est le point critique ici. Le comportement par défaut de
      # `actions/checkout` (`git clean -ffdx`) supprimerait `backend/.env` : il
      # n'est pas versionné, et sur ce Pi il n'est pas régénéré à chaque run
      # comme dans `ci.yml` (qui copie `.env.example`) — il est déposé une
      # seule fois, à la main, avec les vraies valeurs de production.
      - uses: actions/checkout@v7
        with:
          clean: false
          # Le commit que la CI a validé, pas la tête de `main` : entre la CI et
          # ici, `main` a pu avancer. `fetch-depth: 2` pour comparer au parent.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # `workflow_run` ne sait pas filtrer par chemin (l'ancien `push` le
      # faisait) : sans cette étape, un commit qui ne touche que `docs/`
      # reconstruirait les images sur le Pi pour rien. Le parent de `HEAD` est la
      # bonne base, y compris pour un commit de fusion (premier parent = `main`
      # avant la fusion).
      - name: Ignorer les commits sans effet sur l'application
        id: portee
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENEMENT" = "workflow_dispatch" ] \
             || git diff --name-only HEAD~1 HEAD \
                | grep -qE '^(backend/|frontend/|docker-compose\.yml$|\.github/workflows/deploy-web\.yml$)'; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployer=false" >> "$GITHUB_OUTPUT"
            echo "Aucun fichier de l'application modifié — déploiement ignoré."
          fi

      # `--wait` fait échouer le job si le healthcheck du backend ne passe pas
      # ou si le frontend ne démarre pas derrière son `service_healthy` : un
      # démarrage cassé arrête le déploiement ici, avec un run rouge visible,
      # pas en silence sur le Pi.
      # npm plutôt que le script d'install officiel (curl | sudo bash + apt-get) :
      # ce dernier échoue sur un runner sans TTY ("sudo: a password is required"),
      # alors que `npm install -g` ne demande pas sudo tant que Node tourne en
      # espace utilisateur — déjà le cas ici puisque le runner exécute les
      # scripts npm du projet.
      - name: Installer Infisical CLI (si absent)
        if: steps.portee.outputs.deployer == 'true'
        run: command -v infisical >/dev/null 2>&1 || npm install -g @infisical/cli

      - name: Build & redémarrage
        if: steps.portee.outputs.deployer == 'true'
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --domain="http://caesura.tailb8daf5.ts.net:8090/api" --silent --plain)
          infisical run --token="$TOKEN" \
            --domain="http://caesura.tailb8daf5.ts.net:8090/api" \
            --projectId="db436bc3-c41c-4439-a385-1a547f7c4846" --env=prod -- \
            docker compose --env-file frontend/.env --env-file backend/.env up -d --build --wait --wait-timeout 120
