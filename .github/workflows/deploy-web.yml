name: Deploy Web to Raspberry Pi

# Contrairement à `build-twa.yml` (runner GitHub, secrets éphémères), ce
# workflow tourne sur le Pi lui-même : c'est le runner self-hosted qui va
# chercher le job en se connectant vers GitHub — aucun port entrant à ouvrir
# sur le Pi, aucune clé SSH à stocker en secret.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

# Une seule mise à jour à la fois : deux déploiements simultanés se
# disputeraient les mêmes conteneurs sur le même hôte.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Pi — build & redémarrage
    # Label dédié plutôt que `self-hosted` seul : si un autre runner
    # self-hosted rejoignait un jour ce dépôt, il ne faut pas qu'il hérite par
    # erreur d'un job qui déchiffre ou touche à la prod du Pi.
    runs-on: [self-hosted, raspberry-pi]
    timeout-minutes: 20

    steps:
      # `clean: false` est le point critique ici. Le comportement par défaut de
      # `actions/checkout` (`git clean -ffdx`) supprimerait `backend/.env` : il
      # n'est pas versionné, et sur ce Pi il n'est pas régénéré à chaque run
      # comme dans `ci.yml` (qui copie `.env.example`) — il est déposé une
      # seule fois, à la main, avec les vraies valeurs de production.
      - uses: actions/checkout@v7
        with:
          clean: false

      # `--wait` fait échouer le job si le healthcheck du backend ne passe pas
      # ou si le frontend ne démarre pas derrière son `service_healthy` : un
      # démarrage cassé arrête le déploiement ici, avec un run rouge visible,
      # pas en silence sur le Pi.
      - name: Installer Infisical CLI (si absent)
        run: |
          command -v infisical >/dev/null 2>&1 || {
            curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
            sudo apt-get install -y infisical
          }

      - name: Build & redémarrage
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --domain="http://caesura.tailb8daf5.ts.net:8090/api" --silent --plain)
          infisical run --token="$TOKEN" \
            --domain="http://caesura.tailb8daf5.ts.net:8090/api" \
            --projectId="db436bc3-c41c-4439-a385-1a547f7c4846" --env=prod -- \
            docker compose --env-file frontend/.env --env-file backend/.env up -d --build --wait --wait-timeout 120
