name: Build TWA Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-qcweather/**'

# Le keystore de production ne doit être déchiffré que par ce workflow.
permissions:
  contents: read

# Deux builds simultanés se disputeraient le même artefact `qcweather-release`.
concurrency:
  group: twa-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `push` est déjà borné à main, mais `workflow_dispatch` ne l'était pas : le
    # keystore de production pouvait être déchiffré depuis n'importe quelle
    # branche, en contradiction avec ce que promettait le README. Même garde que
    # `deploy-twa.yml`.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Version épinglée : cette étape s'exécute dans le job qui déchiffre le
      # keystore et porte les mots de passe en environnement. Les actions tierces
      # y sont épinglées par SHA ; laisser cette installation flotter en ferait
      # la seule porte ouverte du dépôt.
      #
      # Dependabot ne lit pas les étapes `run` : cette version se relève à la main
      # (`npm view @bubblewrap/cli version`).
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Decode Keystore
        run: |
                echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 --decode > twa-qcweather/android.keystore
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Build AAB
        working-directory: twa-qcweather
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Sans `update`, l'installation échoue dès que l'index de paquets de
          # l'image du runner a pris du retard sur les miroirs.
          sudo apt-get update > /dev/null
          sudo apt-get install -y expect > /dev/null
          chmod +x gradlew
          expect -c '
            set timeout -1
            spawn bubblewrap build --skipPwaValidation
            expect "Would you like to apply" { send "n\r" }
            expect "Password for the Key Store" { send "$env(KSPASS)\r" }
            expect -re {assword for the Key} { send "$env(KPASS)\r" }
            expect eof
          '

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: qcweather-release
          path: twa-qcweather/app-release-bundle.aab
          retention-days: 30

      - name: Supprimer le keystore du workspace
        if: always()
        run: rm -f twa-qcweather/android.keystore