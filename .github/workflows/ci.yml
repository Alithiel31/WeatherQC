name: CI

on:
  push:
    branches: [main]
  # Sans filtre de base : une PR qui vise autre chose que `main` — cas d'une
  # série de PR empilées — n'obtenait aucun check du tout. Une PR sans CI est
  # exactement le filet qu'on cherche à rétablir ici.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Un nouveau push sur une PR annule le run précédent — seul le dernier état
  # compte. Sur `main`, non : chaque commit de main est un candidat au
  # déploiement sur le Pi, et un run annulé laisse un commit sans preuve qu'il
  # passe la CI. Le gain de minutes ne vaut pas ce trou-là.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    # Sans plafond explicite, GitHub laisse un job tourner 6 h. Un `npm ci` qui
    # bloque sur un registre injoignable consomme donc 6 h de runner avant que
    # qui que ce soit ne s'en aperçoive. Ces valeurs sont larges — environ le
    # triple du temps observé — mais bornées.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # Alignée sur les images Docker : tester sur une version que la production
      # n'exécute pas revient à ne pas tester la production.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Échoue si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:coverage

      # Le frontend publie ses rapports, le backend calculait les siens puis les
      # jetait : après un échec de couverture en CI, il n'y avait rien à lire
      # sans rejouer la suite en local.
      - name: Publier la couverture backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-couverture
          path: backend/coverage/
          retention-days: 14
          # `ignore` et non `error` : si le job échoue avant `test:coverage`
          # (format, lint), le dossier n'existe pas et ce n'est pas une anomalie.
          if-no-files-found: ignore

      - run: npm run build

      # Les dépendances de production sont exposées publiquement : une faille
      # haute ou critique doit bloquer, pas attendre une lecture de Dependabot.
      - name: Audit des dépendances
        run: npm audit --audit-level=high --omit=dev

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      # Inclut les tests PWA (manifeste installable + service worker) et échoue
      # si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:ci

      # `always()` : le rapport est surtout utile quand la CI vient d'échouer.
      - name: Publier les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-rapports
          path: |
            frontend/rapport-tests.json
            frontend/coverage/
          retention-days: 14
          if-no-files-found: error

      - run: npm run build

      # `leaflet` est la seule dépendance de production côté frontend ; l'audit
      # complet inclurait toute la chaîne de build et bloquerait sur du bruit.
      - name: Audit des dépendances
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Frontend — parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Le binaire Chromium — environ 150 Mo — était retéléchargé à chaque run.
      # La clé porte sur la version de `@playwright/test` : c'est elle qui décide
      # de la révision du navigateur, et un cache qui survivrait à sa montée
      # ferait tourner les tests sur le mauvais binaire.
      #
      # La version est lue dans le lockfile, pas dans `node_modules` : c'est la
      # version résolue, exacte, et elle reste lisible même si l'étape se
      # déplaçait avant `npm ci`. `package.json` ne conviendrait pas — il porte
      # une plage (`^1.62.1`), et la clé ne bougerait pas lors d'une montée
      # mineure qui change pourtant de navigateur.
      - name: Relever la version de Playwright
        id: playwright
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium seul : la suite ne cible que lui, inutile de tirer Firefox et
      # WebKit à chaque run.
      - name: Installer Chromium et ses dépendances système
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Les bibliothèques système (`--with-deps`) s'installent via apt, hors de
      # `~/.cache` : le cache ne les contient pas, il faut les reposer même quand
      # il est chaud. Sans ça, Chromium échoue au lancement sur un `.so` absent.
      - name: Reposer les dépendances système
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `playwright.config.ts` construit puis sert `dist/` : le parcours passe
      # par le bundle réellement déployé, pas par le serveur de développement.
      - run: npm run test:e2e

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-e2e
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker — build & démarrage réel
    runs-on: ubuntu-latest
    # `docker compose up --wait --wait-timeout 120` a sa propre borne, mais les
    # `docker build` et les `curl` n'en ont aucune.
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --target production -t qcweather-backend ./backend

      - name: Build frontend image
        run: docker build --target production -t qcweather-frontend ./frontend

      # `npm audit --omit=dev` ne juge que les paquets npm. Ce qui tourne sur le
      # Pi est une image Alpine complète : openssl, busybox, les bibliothèques
      # système de nginx. Dependabot suit bien les tags `node:24-alpine` et
      # `nginx:alpine`, mais ne dit rien des CVE de l'image effectivement
      # construite — c'est-à-dire de ce qui est réellement déployé.
      #
      # `--ignore-unfixed` : une CVE sans correctif publié en amont ne peut pas
      # être corrigée ici. La signaler rendrait la CI rouge en permanence, ce qui
      # revient à ne plus rien signaler du tout.
      #
      # `--skip-dirs` écarte npm et yarn, embarqués dans `node:24-alpine`. Le
      # premier scan les a mesurés : 6 HIGH et 1 CRITICAL, toutes dans les
      # dépendances internes de npm — `brace-expansion`, `ip-address`, `tar`,
      # `undici` — pendant qu'Alpine et `app/node_modules/` ressortaient à zéro.
      # Elles sont réelles mais hors d'atteinte : le correctif suppose un npm
      # plus récent dans l'image amont, et rien ici ne peut l'y mettre. Elles
      # sont aussi hors du chemin d'exécution, `CMD` étant `node dist/app.js` —
      # npm ne tourne qu'au build.
      #
      # Le compromis est assumé : une CVE npm réellement exploitable passerait
      # inaperçue. La contrepartie serait un scanner rouge en permanence, donc
      # un scanner que plus personne ne lit.
      #
      # Image épinglée par version, et non `:latest` : Trivy a subi une
      # compromission de chaîne d'approvisionnement en mars 2026. Comme
      # Bubblewrap, ce numéro se relève à la main — Dependabot ne lit pas les
      # étapes `run`.
      - name: Scanner les images construites
        run: |
          set -euo pipefail
          for image in qcweather-backend qcweather-frontend; do
            echo "── $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.73.0 image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --skip-dirs usr/local/lib/node_modules/npm \
                --skip-dirs opt/yarn-v1.22.22 \
                --no-progress \
                "$image"
          done

      # Le job s'arrêtait après les deux `docker build`. Ne sont donc validés par
      # rien avant le déploiement sur le Pi : la syntaxe de `docker-compose.yml`,
      # le `depends_on: service_healthy`, la commande de healthcheck, la config
      # nginx, et une variable d'environnement invalide qui ferait échouer
      # `config.ts` au démarrage.
      - name: Préparer la configuration
        run: cp backend/.env.example backend/.env

      # Pas de `nginx -t` isolé : `proxy_pass http://backend:3005` exige de
      # résoudre l'hôte `backend`, qui n'existe que dans le réseau du compose.
      # Un conteneur seul échoue donc sur une configuration pourtant valide.
      # C'est le démarrage réel ci-dessous qui fait office de test : nginx y
      # relit sa configuration dans le bon réseau, et refuse de démarrer si elle
      # est fautive — ce que `--wait` puis les `curl` détectent.
      #
      # `--wait` rend la main quand le healthcheck du backend est passé et que
      # le frontend a démarré derrière son `service_healthy`. Un healthcheck
      # cassé ou un boot qui échoue fait échouer cette étape, pas le déploiement.
      - name: Démarrer la pile
        run: docker compose up -d --wait --wait-timeout 120

      - name: Vérifier l’API à travers nginx
        run: |
          set -euo pipefail
          curl -fsS localhost/api/sante | grep -q '"statut":"ok"'
          curl -fsS localhost/api/villes | grep -q 'montreal'
          # La coquille applicative doit être servie, pas seulement l'API.
          curl -fsS localhost/ | grep -q 'manifest.webmanifest'

      - name: Vérifier les en-têtes de sécurité
        run: |
          set -euo pipefail
          entetes=$(curl -fsSI localhost/)
          for attendu in content-security-policy x-content-type-options referrer-policy \
                         strict-transport-security permissions-policy; do
            echo "$entetes" | grep -qi "^$attendu:" || { echo "en-tête manquant : $attendu"; exit 1; }
          done
          # `add_header` en nginx remplace au lieu de fusionner : un bloc
          # `location` qui en déclare un perd tous ceux du parent. assetlinks.json
          # est le cas où ça s'était déjà produit.
          curl -fsSI localhost/.well-known/assetlinks.json | grep -qi '^content-security-policy:'
          # Et un seul Content-Type — le doublon fait échouer la vérification
          # Digital Asset Links d'Android.
          test "$(curl -fsSI localhost/.well-known/assetlinks.json | grep -ci '^content-type:')" -eq 1

      - name: Vérifier les pages légales
        run: |
          set -euo pipefail
          # `privacy-policy.html` est l'URL déclarée dans la console Google Play :
          # la casser ne se voit qu'à la prochaine revue de l'application.
          for page in privacy-policy.html privacy-policy.en.html \
                      terms.html terms.en.html \
                      legal.html legal.en.html; do
            corps=$(curl -fsS "localhost/$page")
            # `location /` retombe sur `/index.html` : un fichier absent
            # renverrait la coquille applicative en 200 plutôt qu'un 404. Le
            # test porte donc sur le contenu, pas sur le code de statut.
            echo "$corps" | grep -q 'href="/legal.css"' \
              || { echo "$page ne sert pas la page légale attendue"; exit 1; }
            echo "$corps" | grep -q 'href="/"' \
              || { echo "$page n'a pas de lien de retour vers l'application"; exit 1; }
          done
          curl -fsS localhost/legal.css | grep -q 'max-width'
          # Les liens du pied doivent exister dès la coquille : ils ne dépendent
          # pas de l'arrivée des prévisions. La page était restée orpheline —
          # servie, mais liée depuis nulle part.
          bundle=$(curl -fsS localhost/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          corps_bundle=$(curl -fsS "localhost$bundle")
          for page in privacy-policy.html terms.html legal.html; do
            echo "$corps_bundle" | grep -q "/$page" \
              || { echo "l'application ne lie pas $page"; exit 1; }
          done
          # Même piège `add_header` que pour assetlinks.json : ces pages passent
          # par le bloc `location /`, elles doivent hériter des en-têtes.
          curl -fsSI localhost/terms.html | grep -qi '^content-security-policy:'

      - name: Vérifier compression et politique de cache
        run: |
          set -euo pipefail
          asset=$(curl -fsS localhost/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          # Assets hachés : cache long. Coquille : jamais mise en cache, sinon un
          # déploiement resterait invisible.
          curl -fsSI "localhost$asset" | grep -qi 'cache-control:.*max-age=31536000'
          curl -fsSI localhost/index.html | grep -qi 'cache-control:.*no-cache'
          # GET et non HEAD : la négociation gzip se lit sur une vraie réponse.
          curl -fsS -H 'Accept-Encoding: gzip' -o /dev/null -D - "localhost$asset" \
            | grep -qi '^content-encoding: gzip'

      - name: Publier les logs en cas d’échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  dependances:
    name: Revue des dépendances ajoutées
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # L'action compare la base et la tête d'une PR : hors PR, il n'y a rien à
    # comparer.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      # Le résumé est posté en commentaire sur la PR en cas d'échec.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Complémentaire de `npm audit`, qui juge l'arbre une fois la dépendance
      # déjà là : celui-ci bloque son *introduction*, et couvre les cinq
      # manifestes d'un coup — npm racine, backend, frontend, et Gradle — là où
      # `npm audit` ignore le module Android.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
