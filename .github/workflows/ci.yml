name: CI

on:
  push:
    branches: [main]
  # Sans filtre de base : une PR qui vise autre chose que `main` — cas d'une
  # série de PR empilées — n'obtenait aucun check du tout. Une PR sans CI est
  # exactement le filet qu'on cherche à rétablir ici.
  pull_request:

permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Échoue si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build

      # Les dépendances de production sont exposées publiquement : une faille
      # haute ou critique doit bloquer, pas attendre une lecture de Dependabot.
      - name: Audit des dépendances
        run: npm audit --audit-level=high --omit=dev

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      # Inclut les tests PWA (manifeste installable + service worker) et échoue
      # si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:ci

      # `always()` : le rapport est surtout utile quand la CI vient d'échouer.
      - name: Publier les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rapports
          path: |
            frontend/rapport-tests.json
            frontend/coverage/
          retention-days: 14
          if-no-files-found: error

      - run: npm run build

      # `leaflet` est la seule dépendance de production côté frontend ; l'audit
      # complet inclurait toute la chaîne de build et bloquerait sur du bruit.
      - name: Audit des dépendances
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Frontend — parcours de bout en bout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chromium seul : la suite ne cible que lui, inutile de tirer Firefox et
      # WebKit à chaque run.
      - run: npx playwright install --with-deps chromium

      # `playwright.config.ts` construit puis sert `dist/` : le parcours passe
      # par le bundle réellement déployé, pas par le serveur de développement.
      - run: npm run test:e2e

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker — build & démarrage réel
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target production -t qcweather-backend ./backend

      - name: Build frontend image
        run: docker build --target production -t qcweather-frontend ./frontend

      # Le job s'arrêtait après les deux `docker build`. Ne sont donc validés par
      # rien avant le déploiement sur le Pi : la syntaxe de `docker-compose.yml`,
      # le `depends_on: service_healthy`, la commande de healthcheck, la config
      # nginx, et une variable d'environnement invalide qui ferait échouer
      # `config.ts` au démarrage.
      - name: Préparer la configuration
        run: cp backend/.env.example backend/.env

      # Pas de `nginx -t` isolé : `proxy_pass http://backend:3005` exige de
      # résoudre l'hôte `backend`, qui n'existe que dans le réseau du compose.
      # Un conteneur seul échoue donc sur une configuration pourtant valide.
      # C'est le démarrage réel ci-dessous qui fait office de test : nginx y
      # relit sa configuration dans le bon réseau, et refuse de démarrer si elle
      # est fautive — ce que `--wait` puis les `curl` détectent.
      #
      # `--wait` rend la main quand le healthcheck du backend est passé et que
      # le frontend a démarré derrière son `service_healthy`. Un healthcheck
      # cassé ou un boot qui échoue fait échouer cette étape, pas le déploiement.
      - name: Démarrer la pile
        run: docker compose up -d --wait --wait-timeout 120

      - name: Vérifier l’API à travers nginx
        run: |
          set -euo pipefail
          curl -fsS localhost/api/sante | grep -q '"statut":"ok"'
          curl -fsS localhost/api/villes | grep -q 'montreal'
          # La coquille applicative doit être servie, pas seulement l'API.
          curl -fsS localhost/ | grep -q 'manifest.webmanifest'

      - name: Publier les logs en cas d’échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v
