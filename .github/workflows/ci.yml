name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Échoue si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      # Inclut les tests PWA (manifeste installable + service worker) et échoue
      # si la couverture passe sous les seuils de vitest.config.ts.
      - run: npm run test:ci

      # `always()` : le rapport est surtout utile quand la CI vient d'échouer.
      - name: Publier les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rapports
          path: |
            frontend/rapport-tests.json
            frontend/coverage/
          retention-days: 14
          if-no-files-found: error

      - run: npm run build

  docker:
    name: Docker — validate builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target production -t qcweather-backend ./backend

      - name: Build frontend image
        run: docker build --target production -t qcweather-frontend ./frontend
