version: 2

# Trois manifestes npm distincts (racine, backend, frontend) : chacun a besoin de
# sa propre entrée, Dependabot ne parcourt pas les sous-dossiers tout seul.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Une seule PR pour l'outillage de développement : ces montées se relisent
      # ensemble et n'atteignent pas la production.
      outils-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      outils-dev:
        dependency-type: development

  # Les actions manipulant le keystore et la clé Play Store sont épinglées par
  # SHA : sans Dependabot, ces épingles ne bougeraient plus jamais.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Les images de base ne bougeaient pas : `node:22-alpine` et `nginx:alpine`
  # sont pourtant là où atterrissent les CVE d'Alpine et de nginx, et c'est ce
  # qui tourne réellement en production sur le Pi.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Le module signé et envoyé au Play Store était le seul sans automatisation de
  # dépendances : AGP, `androidbrowserhelper` et le wrapper Gradle.
  - package-ecosystem: gradle
    directory: /twa-qcweather
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    ignore:
      # Gradle 9.x est incompatible avec l'AGP du projet. `build.gradle` épingle
      # AGP 8.9.1, dont les notes officielles donnent Gradle 8.11.1 en minimum
      # *et* en défaut, et Gradle 9.x n'est testé qu'avec AGP 9.0 et plus récent.
      # Dependabot proposait la 9.6.1 (#26, fermée) : verte en CI, parce que rien
      # ne construisait le module Android avant son merge à l'époque.
      #
      # La règle porte sur la 9.x seule, pas sur toutes les majeures : quand AGP
      # passera en 9.x, cette entrée devra sauter en même temps. Les montées d'AGP
      # et d'`androidbrowserhelper` restent proposées.
      - dependency-name: 'gradle-wrapper'
        versions: ['9.x']
