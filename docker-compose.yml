# La cible est un Raspberry Pi : sans bornes, une fuite mémoire emporte l'hôte
# entier et les logs Docker finissent par remplir la carte SD.
x-logs: &logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *logs
    deploy:
      resources:
        limits:
          # Node au repos tient dans ~80 Mo ; le cache plafonné à
          # CACHE_MAX_ENTRIES en ajoute quelques dizaines. 256 Mo laisse de la
          # marge tout en transformant une fuite en redémarrage plutôt qu'en
          # machine à genoux.
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3005/api/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Embarquée au build par Vite — voir frontend/.env.example. Compose ne
        # supporte pas d'`env_file` au niveau racine du fichier : la valeur vient
        # de --env-file frontend/.env, à passer à chaque invocation de
        # `docker compose` sur ce fichier (voir README.md).
        VITE_OPENWEATHERMAP_KEY: ${VITE_OPENWEATHERMAP_KEY}
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logs
    deploy:
      resources:
        limits:
          # Nginx ne sert que des fichiers statiques et relaie /api/.
          memory: 128M
