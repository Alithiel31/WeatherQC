# La cible est un Raspberry Pi : sans bornes, une fuite mémoire emporte l'hôte
# entier et les logs Docker finissent par remplir la carte SD.
x-logs: &logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Durcissement commun aux conteneurs applicatifs. Un processus compromis se
# retrouve sans écriture possible sur le système de fichiers, sans capacité
# Linux, et sans moyen de regagner des privilèges. Les seuls endroits
# inscriptibles sont /tmp (en mémoire, vidé à chaque redémarrage) et, pour le
# backend, le volume des abonnements.
x-durcissement: &durcissement
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - 'no-new-privileges:true'

services:
  # Les conteneurs ne tournent plus en root, mais un volume créé avant ce
  # changement appartient encore à root : sans cette étape, le backend ne
  # pourrait plus ouvrir la base SQLite au premier déploiement et les
  # abonnements existants deviendraient illisibles. Idempotent, quelques
  # millisecondes ; c'est le seul conteneur qui garde root, pour cette commande
  # et avec la seule capacité CHOWN.
  backend-data-init:
    build:
      context: ./backend
      target: production
    user: '0:0'
    entrypoint: ['chown', '-R', 'node:node', '/app/data']
    labels:
      - 'homelab.tier=app'
    volumes:
      - backend-data:/app/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - 'no-new-privileges:true'
    restart: 'no'
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 16M

  backend:
    <<: *durcissement
    build:
      context: ./backend
      target: production
    labels:
      - 'homelab.tier=app'
    depends_on:
      backend-data-init:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    volumes:
      # Abonnements aux alertes météo (SQLite, voir DB_PATH dans le README) —
      # sans ce volume, ils seraient perdus à chaque `docker compose up --build`,
      # contrairement au cache qui, lui, est fait pour disparaître au redémarrage.
      - backend-data:/app/data
    restart: unless-stopped
    logging: *logs
    deploy:
      resources:
        limits:
          # Node au repos tient dans ~80 Mo ; le cache plafonné à
          # CACHE_MAX_ENTRIES en ajoute quelques dizaines. 256 Mo laisse de la
          # marge tout en transformant une fuite en redémarrage plutôt qu'en
          # machine à genoux.
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3005/api/sante').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    <<: *durcissement
    build:
      context: ./frontend
      target: production
      args:
        # Embarquées au build par Vite — voir frontend/.env.example. Compose ne
        # supporte pas d'`env_file` au niveau racine du fichier : la valeur vient
        # de --env-file frontend/.env, à passer à chaque invocation de
        # `docker compose` sur ce fichier (voir README.md).
        VITE_OPENWEATHERMAP_KEY: ${VITE_OPENWEATHERMAP_KEY}
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY}
    # Aucun port publié sur l'hôte : le frontend est servi par Traefik (réseau
    # traefik-net, routage par nom d'hôte), derrière le tunnel Cloudflare.
    networks:
      - default
      - traefik-net
    labels:
      - 'homelab.tier=app'
      - 'traefik.enable=true'
      - 'traefik.http.routers.qcweather.rule=Host(`qcweather.alithiel31.dev`)'
      - 'traefik.http.routers.qcweather.entrypoints=web'
      - 'traefik.http.services.qcweather.loadbalancer.server.port=8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logs
    deploy:
      resources:
        limits:
          # Nginx ne sert que des fichiers statiques et relaie /api/.
          memory: 128M

networks:
  # Réseau partagé avec Traefik, créé côté Caesura (voir README).
  traefik-net:
    external: true

volumes:
  backend-data:
